<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scolia – Frais de scolarité</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#F4F7F5;--surface:#fff;--ink:#14221C;--muted:#5C6B63;--line:#DCE4DF;--on:#fff;--green:#0B6B43;--green-soft:#DDF0E5;--gold:#F2C230;--red:#C8372D;--red-soft:#FBE4E1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A15;--surface:#172620;--ink:#EAF2ED;--muted:#9BB0A5;--line:#27392F;--green:#3DBE82;--on:#04150D;--green-soft:#17382A;--red:#F0766C;--red-soft:#3A1E1B}}
:root[data-theme="dark"]{--bg:#0F1A15;--surface:#172620;--ink:#EAF2ED;--muted:#9BB0A5;--line:#27392F;--green:#3DBE82;--on:#04150D;--green-soft:#17382A;--red:#F0766C;--red-soft:#3A1E1B}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:16px 16px 90px}
h1{font-size:1.1rem;margin:0;font-weight:600}
.hero{background:#0B6B43;color:#fff;border-radius:18px;padding:18px;margin:12px 0}
.hero .big{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero .sub{opacity:.85;font-size:.9rem;margin-top:4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.hero .bar{background:rgba(255,255,255,.25);margin-top:12px}
.hero .bar i{background:var(--gold)}
.row{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-bottom:10px}
.stu{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.stu .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stu b{font-weight:600}.stu small{color:var(--muted)}
.stu .bar{margin:8px 0 4px}
.late{color:var(--red);font-weight:600}.ok{color:var(--green);font-weight:600}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--green);color:var(--on);width:100%}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn.wa{background:#168A46;color:#fff}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:auto;padding:14px 22px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.hist{margin:10px 0;font-size:.9rem;color:var(--muted)}
.hist div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:4px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}#auth{padding-top:40px}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6B43">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="auth"><h1>Scolia</h1><p style="color:var(--muted)">Frais de scolarité et bulletins pour votre école</p><label for="em">E-mail</label><input id="em" type="email" autocomplete="email"><label for="pw">Mot de passe (6 caractères minimum)</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="li">Se connecter</button><button class="btn alt" id="su">Créer un compte</button><p id="msg" class="late"></p></div>
<div id="parent" hidden></div>
<div id="app" hidden><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1 id="school"></h1><div style="display:flex;gap:6px"><button class="chip" id="team" hidden>Équipe</button><button class="chip" id="out">Déconnexion</button></div></div>
<div class="hero">
  <div class="sub">Encaissé cette année</div>
  <div class="big" id="paid">0 FCFA</div>
  <div class="sub" id="left"></div>
  <div class="bar"><i id="pbar" style="width:0"></i></div>
</div>
<div class="row" id="filters"></div>
<input id="q" placeholder="Rechercher un élève" aria-label="Rechercher un élève">
<div id="list"></div>
<button class="btn fab" id="add">+ Nouvel élève</button>

</div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script>
var KEY="scolia-v1", fmt=function(n){return Math.round(n).toLocaleString("fr-FR").replace(/\u202f/g," ")+" FCFA"};
var today=function(){return new Date().toLocaleDateString("fr-FR")};
var SB=supabase.createClient("https://zydrwdqawftwrkamegcf.supabase.co","sb_publishable_v_wQ9zMSVT6iTGppgoJD0g_pp6W23BN"), db=[], filter="tous", school=null, role="directeur";
function save(){}
async function loadAll(){
  var r=await SB.from("students").select("*, payments(*)").eq("school_id",school.id).order("name");
  if(r.error){alert(r.error.message);return}
  db=r.data.map(function(s){return {id:s.id,name:s.name,cls:s.cls,phone:s.phone,fee:+s.fee,grades:s.grades||{},tok:s.parent_token,
    pay:(s.payments||[]).sort(function(a,b){return a.created_at<b.created_at?-1:1}).map(function(p){return {d:new Date(p.paid_at).toLocaleDateString("fr-FR"),a:+p.amount,m:p.method,by:p.by_email}})}});
  render()}
function sum(s){return s.pay.reduce(function(t,p){return t+p.a},0)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function render(){
  var tf=0,tp=0;db.forEach(function(s){tf+=s.fee;tp+=sum(s)});
  document.getElementById("paid").textContent=fmt(tp);
  document.querySelector(".hero").hidden=role==="enseignant";document.getElementById("add").hidden=role==="enseignant";
  document.getElementById("left").textContent="Reste à encaisser : "+fmt(tf-tp);
  document.getElementById("pbar").style.width=(tf?tp/tf*100:0)+"%";
  var cls=(role==="enseignant"?["tous"]:["tous","impayés"]).concat(Array.from(new Set(db.map(function(s){return s.cls}))));
  document.getElementById("filters").innerHTML=cls.map(function(c){return '<button class="chip" aria-pressed="'+(c===filter)+'" data-f="'+esc(c)+'">'+esc(c.charAt(0).toUpperCase()+c.slice(1))+'</button>'}).join("");
  var q=document.getElementById("q").value.toLowerCase();
  var items=db.filter(function(s){
    var okF=filter==="tous"||(filter==="impayés"?sum(s)<s.fee:s.cls===filter);
    return okF&&s.name.toLowerCase().indexOf(q)>-1});
  document.getElementById("list").innerHTML=items.length?items.map(function(s){
    if(role==="enseignant"){var a=avg(s);return '<button class="stu" data-id="'+s.id+'"><div class="top"><b>'+esc(s.name)+'</b><small>'+esc(s.cls)+'</small></div><small>'+(a===null?'Pas de notes':'Moyenne '+a.toFixed(1)+'/20')+'</small></button>'}
    var p=sum(s),r=s.fee-p;
    return '<button class="stu" data-id="'+s.id+'"><div class="top"><b>'+esc(s.name)+'</b><small>'+esc(s.cls)+'</small></div><div class="bar"><i style="width:'+Math.min(100,p/s.fee*100)+'%"></i></div><small>'+(r>0?'<span class="late">Reste '+fmt(r)+'</span>':'<span class="ok">Soldé</span>')+' · payé '+fmt(p)+'</small></button>'}).join(""):'<div class="empty">Aucun élève ici. Ajoutez-en un avec le bouton ci-dessous.</div>';
}
function open(html){document.getElementById("panel").innerHTML=html;document.getElementById("sheet").classList.add("on")}
function close(){document.getElementById("sheet").classList.remove("on")}

function detail(id){
  if(role==="enseignant"){grades(id);return}
  var s=db.find(function(x){return x.id==id}),p=sum(s),r=s.fee-p;
  var msg="Bonjour, l’école "+school.name+" vous rappelle que les frais de scolarité de "+s.name+" ont un solde de "+fmt(r)+". Merci de régulariser par Mobile Money. Suivi : "+plink(s);
  open('<h1>'+esc(s.name)+' · '+esc(s.cls)+'</h1><p class="'+(r>0?'late':'ok')+'">'+(r>0?'Reste '+fmt(r)+' sur '+fmt(s.fee):'Frais soldés')+'</p>'+
   '<label for="amt">Nouveau versement (FCFA)</label><input id="amt" type="number" inputmode="numeric" placeholder="ex. 25000">'+
   '<label for="mth">Moyen de paiement</label><select id="mth"><option>MTN MoMo</option><option>Moov Money</option><option>Espèces</option></select><button class="btn" id="pay">Enregistrer le versement</button>'+
   (r>0?shareBlock(s.phone,msg,'Relancer le parent'):'')+
   '<div class="hist">'+(s.pay.length?s.pay.map(function(x,i){return '<button class="chip" style="width:100%;display:flex;justify-content:space-between;margin-bottom:6px" data-r="'+i+'"><span>'+x.d+' · '+esc(x.m||'Espèces')+'</span><span>'+fmt(x.a)+' · Reçu</span></button>'}).reverse().join(""):'Aucun versement pour l’instant.')+'</div>'+
   '<button class="btn alt" id="gr">Notes et bulletin</button><button class="btn alt" id="pl">Lien de suivi pour le parent</button>'+(role==="directeur"?'<button class="btn alt" id="rm">Supprimer cet élève</button>':'')+'<button class="btn alt" id="cl">Fermer</button>');
  document.getElementById("pay").onclick=async function(){var a=+document.getElementById("amt").value;if(a>0){var b=this;b.disabled=true;var r=await SB.from("payments").insert({student_id:id,school_id:school.id,amount:a,method:document.getElementById("mth").value});if(r.error){alert(r.error.message);b.disabled=false;return}await loadAll();detail(id)}};
  var rmb=document.getElementById("rm");if(rmb)rmb.onclick=async function(){if(confirm("Supprimer "+s.name+" ?")){await SB.from("students").delete().eq("id",id);await loadAll();close()}};
  document.getElementById("cl").onclick=close;
  document.getElementById("gr").onclick=function(){grades(id)};
  document.getElementById("pl").onclick=function(){parentLink(id)};
  document.querySelector(".hist").onclick=function(e){var b=e.target.closest("[data-r]");if(b)receipt(id,+b.dataset.r)};
}
function receipt(id,i){
  var s=db.find(function(x){return x.id==id}),p=s.pay[i],no="R-"+String(id).slice(-3)+"-"+(i+1);
  var bal=s.fee-s.pay.slice(0,i+1).reduce(function(t,x){return t+x.a},0);
  var txt="Reçu "+no+" – "+school.name+". Élève : "+s.name+" ("+s.cls+"). Versement de "+fmt(p.a)+" le "+p.d+" par "+(p.m||"Espèces")+". Reste à payer : "+fmt(bal)+". Merci.";
  open('<h1>Reçu '+no+'</h1><div class="hero" style="background:var(--surface);color:var(--ink);border:1px dashed var(--line)"><div class="sub">'+esc(s.name)+' · '+esc(s.cls)+' · '+p.d+'</div><div class="big">'+fmt(p.a)+'</div><div class="sub">Payé par '+esc(p.m||'Espèces')+'<br>Reste à payer : '+fmt(bal)+(p.by?'<br>Enregistré par '+esc(p.by):'')+'</div></div>'+
   shareBlock(s.phone,txt,'Envoyer le reçu')+'<button class="btn alt" id="bk">Retour</button>');
  document.getElementById("bk").onclick=function(){detail(id)};
}
var SUB=[["Maths",3],["Français",3],["Anglais",2],["SVT",2],["Histoire-Géo",2]];
function avg(s){var g=s.grades||{},t=0,c=0;SUB.forEach(function(x){if(g[x[0]]!==undefined){t+=g[x[0]]*x[1];c+=x[1]}});return c?t/c:null}
function mention(a){return a>=16?"Très bien":a>=14?"Bien":a>=12?"Assez bien":a>=10?"Passable":"Insuffisant"}
function grades(id){
  var s=db.find(function(x){return x.id==id}),g=s.grades||{},a=avg(s);
  var peers=db.filter(function(x){return x.cls===s.cls&&avg(x)!==null}).sort(function(x,y){return avg(y)-avg(x)});
  var rk=peers.indexOf(s)+1;
  var txt="Bulletin de "+s.name+" ("+s.cls+") : "+SUB.filter(function(x){return g[x[0]]!==undefined}).map(function(x){return x[0]+" "+g[x[0]]+"/20"}).join(", ")+". "+(a===null?"":"Moyenne "+a.toFixed(2)+"/20, "+mention(a)+", rang "+rk+"/"+peers.length+".");
  open('<h1>Bulletin · '+esc(s.name)+'</h1><p class="ok">'+(a===null?'Aucune note saisie':'Moyenne '+a.toFixed(2)+'/20 · '+mention(a)+' · rang '+rk+'/'+peers.length)+'</p>'+
   SUB.map(function(x,i){return '<label for="g'+i+'">'+x[0]+' (coef. '+x[1]+') sur 20</label><input id="g'+i+'" type="number" min="0" max="20" step="0.25" inputmode="decimal" value="'+(g[x[0]]===undefined?'':g[x[0]])+'">'}).join('')+
   '<button class="btn" id="sg">Enregistrer les notes</button>'+
   (a!==null?shareBlock(s.phone,txt,'Envoyer le bulletin'):'')+
   '<button class="btn alt" id="bk">Retour</button>');
  document.getElementById("bk").onclick=function(){if(role==="enseignant")close();else detail(id)};
  document.getElementById("sg").onclick=function(){
    var n={};SUB.forEach(function(x,i){var v=document.getElementById("g"+i).value;if(v!=="")n[x[0]]=Math.max(0,Math.min(20,+v))});
    SB.from("students").update({grades:n}).eq("id",id).then(function(r){if(r.error){alert(r.error.message);return}s.grades=n;grades(id)})};
}
var TXT="";
function shareBlock(ph,txt,lab){
  TXT=txt;var e=encodeURIComponent(txt),n=ph?esc(ph):"";
  return '<div style="font-size:.85rem;color:var(--muted);margin-top:12px">'+lab+'</div><div style="display:flex;gap:8px;margin-top:6px">'+
   (navigator.share?'<button class="btn" data-sh="1" style="flex:1">Partager</button>':'')+
   '<a class="btn wa" style="flex:1;display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+n+'?text='+e+'">WhatsApp</a>'+
   (n?'<a class="btn alt" style="flex:1;margin-top:0;display:block;text-align:center;text-decoration:none" href="sms:+'+n+'?&body='+e+'">SMS</a>':'')+'</div>'}
document.getElementById("panel").addEventListener("click",function(ev){if(ev.target.closest("[data-sh]"))navigator.share({text:TXT}).catch(function(){})});
var RL={directeur:"Directeur",econome:"Économe",enseignant:"Enseignant"};
async function team(){
  var a=await SB.from("school_members").select("user_id,email,role").eq("school_id",school.id).order("created_at");
  var b=await SB.from("invitations").select("id,email,role").eq("school_id",school.id).order("created_at");
  if(a.error||b.error){alert((a.error||b.error).message);return}
  var me=(await SB.auth.getUser()).data.user.id;
  open('<h1>Équipe</h1><div class="hist">'+a.data.map(function(x){return '<div><span>'+esc(x.email)+' · '+RL[x.role]+'</span>'+(x.user_id===me?'<span>vous</span>':'<button class="chip" data-m="'+x.user_id+'">Retirer</button>')+'</div>'}).join("")+
   b.data.map(function(x){return '<div><span>'+esc(x.email)+' · '+RL[x.role]+' (invité)</span><button class="chip" data-i="'+x.id+'">Annuler</button></div>'}).join("")+'</div>'+
   '<label for="ie">Inviter par e-mail</label><input id="ie" type="email" placeholder="econome@exemple.com"><label for="ir">Rôle</label><select id="ir"><option value="econome">Économe (versements et reçus)</option><option value="enseignant">Enseignant (notes seulement)</option><option value="directeur">Directeur (accès complet)</option></select>'+
   '<button class="btn" id="iv">Envoyer l’invitation</button><button class="btn alt" id="cl">Fermer</button>');
  document.getElementById("cl").onclick=close;
  document.querySelector(".hist").onclick=async function(e){
    var bm=e.target.closest("[data-m]"),bi=e.target.closest("[data-i]");
    if(bm&&confirm("Retirer cette personne de l’école ?")){var r=await SB.from("school_members").delete().eq("school_id",school.id).eq("user_id",bm.dataset.m);if(r.error){alert(r.error.message);return}team()}
    if(bi){var r2=await SB.from("invitations").delete().eq("id",bi.dataset.i);if(r2.error){alert(r2.error.message);return}team()}};
  document.getElementById("iv").onclick=async function(){
    var em=document.getElementById("ie").value.trim().toLowerCase(),b=this;
    if(!/^\S+@\S+\.\S+$/.test(em)){alert("Entrez un e-mail valide.");return}
    b.disabled=true;
    var r=await SB.from("invitations").insert({school_id:school.id,email:em,role:document.getElementById("ir").value});
    if(r.error){alert(r.error.code==="23505"?"Cette personne est déjà invitée.":r.error.message);b.disabled=false;return}
    var link=location.origin+location.pathname;
    var txt="Bonjour, je vous invite à rejoindre "+school.name+" sur Scolia. Créez un compte avec cet e-mail ("+em+") ici : "+link;
    open('<h1>Invitation créée</h1><p>Dites à <b>'+esc(em)+'</b> de créer un compte avec cet e-mail sur Scolia. Cette personne rejoindra l’école automatiquement.</p><input readonly value="'+esc(link)+'" onclick="this.select()">'+shareBlock("",txt,"Envoyer l’invitation")+'<button class="btn alt" id="bk2">Retour à l’équipe</button>');
    document.getElementById("bk2").onclick=team};
}
function plink(s){return location.origin+location.pathname+"?p="+s.tok}
function parentLink(id){
  var s=db.find(function(x){return x.id==id}),l=plink(s);
  var txt="Bonjour, suivez les frais de scolarité et les notes de "+s.name+" ici : "+l;
  open('<h1>Lien pour le parent</h1><p style="color:var(--muted)">Ce lien est personnel : il montre uniquement les frais et les notes de '+esc(s.name)+', sans aucune modification possible.</p><input id="lk" readonly value="'+esc(l)+'" onclick="this.select()">'+
   shareBlock(s.phone,txt,'Envoyer le lien')+
   '<button class="btn alt" id="cp">Copier le lien</button><button class="btn alt" id="nw">Créer un nouveau lien (annule l’ancien)</button><button class="btn alt" id="bk">Retour</button>');
  document.getElementById("cp").onclick=function(){var b=this;try{navigator.clipboard.writeText(l).then(function(){b.textContent="Lien copié ✓"})}catch(e){document.getElementById("lk").select()}};
  document.getElementById("nw").onclick=async function(){
    if(!confirm("L’ancien lien ne fonctionnera plus. Continuer ?"))return;
    var r=await SB.from("students").update({parent_token:crypto.randomUUID()}).eq("id",id);
    if(r.error){alert(r.error.message);return}
    await loadAll();parentLink(id)};
  document.getElementById("bk").onclick=function(){detail(id)};
}
async function parentView(t){
  document.getElementById("auth").hidden=true;
  var box=document.getElementById("parent");box.hidden=false;
  box.innerHTML='<p class="empty">Chargement…</p>';
  var r=await SB.rpc("parent_view",{t:t});
  if(r.error||!r.data){box.innerHTML='<p class="empty">Ce lien n’est pas valide. Demandez un nouveau lien à l’école.</p>';return}
  var d=r.data,p=d.payments||[],g=d.grades||{},paid=p.reduce(function(x,y){return x+ +y.a},0),left=d.fee-paid,av=avg({grades:g});
  box.innerHTML='<h1>'+esc(d.school)+'</h1><p style="color:var(--muted);margin:2px 0 0">'+esc(d.name)+' · '+esc(d.cls)+'</p>'+
   '<div class="hero"><div class="sub">'+(left>0?'Reste à payer':'Frais soldés')+'</div><div class="big">'+fmt(left>0?left:paid)+'</div><div class="sub">Payé '+fmt(paid)+' sur '+fmt(d.fee)+'</div><div class="bar"><i style="width:'+Math.min(100,paid/d.fee*100)+'%"></i></div></div>'+
   '<h1>Versements</h1><div class="hist">'+(p.length?p.slice().reverse().map(function(x){return '<div><span>'+new Date(x.d).toLocaleDateString("fr-FR")+' · '+esc(x.m)+'</span><span>'+fmt(+x.a)+'</span></div>'}).join(""):'Aucun versement pour l’instant.')+'</div>'+
   '<h1 style="margin-top:18px">Notes</h1>'+(av===null?'<p class="empty">Aucune note pour l’instant.</p>':'<p class="ok">Moyenne '+av.toFixed(2)+'/20 · '+mention(av)+'</p><div class="hist">'+SUB.filter(function(x){return g[x[0]]!==undefined}).map(function(x){return '<div><span>'+x[0]+'</span><span>'+g[x[0]]+'/20</span></div>'}).join("")+'</div>')+
   '<p style="color:var(--muted);font-size:.8rem;margin-top:24px">Page en lecture seule fournie par '+esc(d.school)+'.</p>';
}
function form(){
  open('<h1>Nouvel élève</h1><label for="n">Nom complet</label><input id="n"><label for="c">Classe</label><input id="c" placeholder="ex. CM1">'+
   '<label for="f">Frais annuels (FCFA)</label><input id="f" type="number" inputmode="numeric" value="150000">'+
   '<label for="p">WhatsApp du parent (avec indicatif)</label><input id="p" inputmode="tel" placeholder="22997000000">'+
   '<button class="btn" id="ok">Ajouter l’élève</button><button class="btn alt" id="cl">Annuler</button>');
  document.getElementById("cl").onclick=close;
  document.getElementById("ok").onclick=function(){
    var n=document.getElementById("n").value.trim(),c=document.getElementById("c").value.trim(),f=+document.getElementById("f").value;
    if(!n||!c||!(f>0)){alert("Renseignez le nom, la classe et les frais.");return}
    var b=this;b.disabled=true;
    SB.from("students").insert({school_id:school.id,name:n,cls:c,fee:f,phone:document.getElementById("p").value.replace(/\D/g,"")}).then(async function(r){if(r.error){alert(r.error.message);b.disabled=false;return}await loadAll();close()})};
}
document.getElementById("add").onclick=form;
document.getElementById("q").oninput=render;
document.getElementById("sheet").onclick=function(e){if(e.target.id==="sheet")close()};
document.getElementById("filters").onclick=function(e){var b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;render()}};
document.getElementById("list").onclick=function(e){var b=e.target.closest("[data-id]");if(b)detail(b.dataset.id)};
async function enter(){
  var u=await SB.auth.getUser();
  if(!u.data.user){document.getElementById("auth").hidden=false;document.getElementById("app").hidden=true;return}
  await SB.rpc("accept_invites");
  var uid=u.data.user.id;
  var q1=function(){return SB.from("school_members").select("role, schools(id,name)").eq("user_id",uid).limit(1)};
  var r=await q1();
  if(r.error){alert(r.error.message);return}
  if(!r.data.length){var nm=prompt("Nom de votre école ?")||"Mon école";var c=await SB.from("schools").insert({name:nm});if(c.error){alert(c.error.message);return}r=await q1();if(r.error||!r.data.length){alert("Création impossible");return}}
  school=r.data[0].schools;role=r.data[0].role;
  document.getElementById("school").textContent=school.name;
  document.getElementById("team").hidden=role!=="directeur";
  document.getElementById("auth").hidden=true;document.getElementById("app").hidden=false;await loadAll()}
async function go(up){
  var e=document.getElementById("em").value.trim(),p=document.getElementById("pw").value,m=document.getElementById("msg");
  var r=up?await SB.auth.signUp({email:e,password:p}):await SB.auth.signInWithPassword({email:e,password:p});
  if(r.error){m.textContent=r.error.message;return}
  if(up&&!r.data.session){m.textContent="Compte créé. Confirmez votre e-mail, puis connectez-vous.";return}
  enter()}
document.getElementById("li").onclick=function(){go(false)};
document.getElementById("su").onclick=function(){go(true)};
document.getElementById("team").onclick=function(){team()};
document.getElementById("out").onclick=function(){SB.auth.signOut().then(enter)};
var PT=new URLSearchParams(location.search).get("p");
if(PT){parentView(PT)}else{enter()}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
